[project]
name = "airport-project"
version = "0.1.0"
description = "Projet Trafic Aérien : WebApp Shiny for Python (Mission 3)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "shiny>=1.2",
    "shinywidgets>=0.5",
    "plotly>=5.24",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "faicons>=0.2",
    "nycflights13>=0.0.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Erreurs réelles uniquement (syntaxe, noms non définis, imports inutilisés, pièges courants), pas le style.
select = ["E4", "E7", "E9", "F", "B"]
# zip() sur des colonnes d'un même DataFrame : longueurs toujours égales.
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Le code de l'app importe ses modules sans préfixe (from utils import ...), comme le fait `shiny run`.
pythonpath = ["app"]
