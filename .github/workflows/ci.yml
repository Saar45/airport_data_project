# CI/CD.
# - check  : à chaque push et pull request, on vérifie que l'app est déployable (aucun secret : données locales).
# - deploy : sur main, uniquement si check passe, le contenu de app/ est publié seul sur la branche `deploy`.
#            Posit Connect Cloud publie cette branche (app.py + requirements.txt à la racine, sans les notebooks
#            du dépôt, qui lui faisaient réclamer jupyter).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, tests, dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Installer Python et les dépendances (versions exactes de uv.lock)
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check app tests scripts

      - name: app/requirements.txt est synchronisé avec uv.lock
        run: |
          uv export --no-dev --no-emit-project --no-hashes --no-header -o /tmp/requirements.txt --quiet
          if ! diff -u app/requirements.txt /tmp/requirements.txt; then
            echo "::error file=app/requirements.txt::Fichier désynchronisé de uv.lock. Lancer : uv export --no-dev --no-emit-project --no-hashes --no-header -o app/requirements.txt"
            exit 1
          fi

      - name: Tests (pytest, données locales)
        run: uv run pytest -q

      - name: L'app démarre et répond (shiny run)
        env:
          DATA_SOURCE: local
        run: |
          # Lancé directement depuis .venv (pas via `uv run`) et arrêté en fin d'étape : un processus uv
          # resté actif garde le cache verrouillé et bloque le nettoyage de setup-uv.
          .venv/bin/shiny run app/app.py --port 8000 > shiny.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/ | grep -q "Trafic aérien NYC"; then echo "App OK après ${i}s"; exit 0; fi
            sleep 1
          done
          echo "::error::L'app n'a pas répondu en 60 s"; cat shiny.log; exit 1

  deploy:
    name: Publier la branche deploy (Connect Cloud)
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write          # pousser la branche deploy
    steps:
      - uses: actions/checkout@v4

      - name: Construire la branche deploy à partir de app/ (fichiers suivis par git uniquement)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$(mktemp -d)"
          git archive HEAD:app | tar -x -C "$out"
          printf '%s\n' \
            "Branche générée automatiquement par la CI à partir du dossier app/ de main (commit ${GITHUB_SHA})." \
            "Ne pas la modifier à la main : chaque push sur main qui passe la CI la remplace." > "$out/DEPLOY.md"
          cd "$out"
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Déploiement de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy
          echo "Branche deploy publiée : $(git ls-files | wc -l) fichiers, commit source ${GITHUB_SHA::7}"
